<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdea5"/>
      <stop offset="35%" stop-color="#fed488"/>
      <stop offset="70%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#775a19"/>
    </linearGradient>
    <linearGradient id="darkNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d42"/>
      <stop offset="100%" stop-color="#0a1524"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6b8"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#785a1a"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#darkNavy)" stroke="url(#shieldBorder)" stroke-width="2"/>

  <!-- Gold Bullion Ingot Silhouette -->
  <!-- Top trapezoid of gold bar -->
  <path d="M12 18 L16 11 L32 11 L36 18 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <!-- Front face of gold bar -->
  <path d="M10 18 L38 18 L35 34 L13 34 Z" fill="url(#goldGrad)"/>

  <!-- Metallic Chamfer Shading -->
  <path d="M10 18 L13 34 L16 34 L12 18 Z" fill="#000000" opacity="0.25"/>
  <path d="M38 18 L35 34 L32 34 L36 18 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Inner BIS Triangle Hallmark Emblem -->
  <polygon points="24,20 31,31 17,31" fill="#0a1524" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Central Diamond / Dot in Hallmark -->
  <circle cx="24" cy="27" r="1.8" fill="#ffd580"/>
  <circle cx="24" cy="22.5" r="0.9" fill="#ffd580"/>

  <!-- Sparkle Accent on Top Right -->
  <path d="M36 7 L37.5 10.5 L41 12 L37.5 13.5 L36 17 L34.5 13.5 L31 12 L34.5 10.5 Z" fill="#ffe6b8"/>
</svg>
